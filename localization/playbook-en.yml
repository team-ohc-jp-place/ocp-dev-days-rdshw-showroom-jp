site:
  title: OpenShift Dev Day
  start_page: modules::index.adoc
content:
  sources:
    - url: ../ocp-dev-days-rdshw-showroom
      branches: HEAD
      start_path: content
ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/latest/ui-bundle.zip
    snapshot: true
antora:
  extensions:
    - require: '@sntke/antora-mermaid-extension'
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs
      script_stem: header-scripts
      mermaid_initialize_options:
        start_on_load: true
output:
  dir: ./www/en
asciidoc:
  attributes:
    user: "user01"
    username: "user01"
    password: "LOCAL-PREVIEW-ONLY"
    user-password: "LOCAL-PREVIEW-ONLY"
    openshift_cluster_ingress_domain: "apps.workshop.example.test"
    openshift_cluster_console_url: "https://console-openshift-console.apps.workshop.example.test"
    openshift_console_url: "https://console-openshift-console.apps.workshop.example.test"
    openshift_api_server_url: "https://api.workshop.example.test:6443"
    litellm_virtual_key: "LOCAL-PREVIEW-ONLY"
    litellm_api_base_url: "https://litellm.apps.workshop.example.test"
    url-docserver: "https://docserver-showroom.apps.workshop.example.test"
    lang: en
